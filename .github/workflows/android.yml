name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, test and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Save APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-results
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/outputs/screenshots/
